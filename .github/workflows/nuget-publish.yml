name: 📦 WebFlux NuGet Package Build & Publish

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'src/WebFlux/**/*.cs'
      - 'tests/**/*.cs'
      - '.github/workflows/nuget-publish.yml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to NuGet.org'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow builds, tests and packs, uploads the packages as an artifact and asks the
# organization's central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy
# and checks this repository, this workflow file and the package ids against an allowlist. No NuGet credential lives here.
jobs:
  detect-version:
    name: 🔍 Detect Version Changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 📊 Extract Version from Directory.Build.props
        id: extract-version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]*' Directory.Build.props)
          VERSION_SUFFIX=$(grep -oP '(?<=<VersionSuffix>)[^<]*' Directory.Build.props || echo "")

          if [ -n "$VERSION_SUFFIX" ] && [ "$VERSION_SUFFIX" != "" ]; then
            FULL_VERSION="${VERSION}-${VERSION_SUFFIX}"
          else
            FULL_VERSION="$VERSION"
          fi

          echo "Extracted VersionPrefix: $VERSION"
          echo "Extracted VersionSuffix: $VERSION_SUFFIX"
          echo "Full version: $FULL_VERSION"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT

  build:
    name: 🔨 Build & Test Solution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: detect-version
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore Dependencies
        run: dotnet restore WebFlux.slnx

      - name: 🔨 Build Solution
        run: dotnet build WebFlux.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: 🧪 Run Fast Tests (excluding Integration, Performance and LongRunning)
        run: dotnet test --project tests/WebFlux.Tests/WebFlux.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --filter-not-trait "Category=Integration" --filter-not-trait "Category=Performance" --filter-not-trait "Category=LongRunning" --hangdump --hangdump-timeout 5m

      - name: ℹ️ Test Execution Info
        run: |
          echo "✅ Fast tests completed successfully"
          echo "⏭️ Performance and LongRunning tests are excluded from CI for efficiency"
          echo "💡 To run all tests locally: ./scripts/full-test.ps1 -IncludePerformance -IncludeLongRunning"

  pack:
    name: 📦 Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    needs: [detect-version, build]
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_publish == 'true'
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore Dependencies
        run: dotnet restore WebFlux.slnx

      # Pack the solution, not a single project. Every packable project shares one version and the
      # optional packages hard-pin the base one, so packing a subset publishes a broken closure:
      # the base package resolves, the companion never appears, and nothing here fails — the gap is
      # only visible to a consumer who follows the release notes.
      - name: 📦 Create NuGet Packages
        run: |
          dotnet pack WebFlux.slnx \
            --configuration Release \
            --output nupkg/ \
            --no-restore

      - name: 📋 Verify Packages
        run: |
          ls -la nupkg/
          # Every packable project must have produced a package at this version. A missing one would
          # otherwise be discovered by a consumer rather than here.
          version="${{ needs.detect-version.outputs.version }}"
          missing=0
          for id in WebFlux WebFlux.Playwright; do
            if [ ! -f "nupkg/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # This workflow runs on every push that touches the sources, and the old push skipped a version nuget.org already had.
      # The central call is not free, so ask nuget.org first: hand the packages over only when one of them is missing there
      # (or when the run was started by hand with force_publish).
      - name: 🔍 Decide whether to publish
        id: decide
        run: |
          version="${{ needs.detect-version.outputs.version }}"
          publish=false
          if [ "${{ github.event.inputs.force_publish }}" == "true" ]; then
            publish=true
          else
            for id in WebFlux WebFlux.Playwright; do
              lower="${id,,}"
              status=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${lower}/${version,,}/${lower}.${version,,}.nupkg")
              if [ "$status" != "200" ]; then
                echo "${id} ${version} is not on nuget.org (HTTP ${status}) - publish"
                publish=true
              else
                echo "${id} ${version} is already on nuget.org"
              fi
            done
          fi
          echo "publish=$publish" >> $GITHUB_OUTPUT

      # Only .nupkg files, as before (the old push used `--no-symbols`); the central publisher pushes every .snupkg it finds.
      - name: 📤 Upload packages
        if: ${{ steps.decide.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 1

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    name: 🚀 Publish to NuGet.org
    needs: pack
    if: ${{ needs.pack.outputs.publish == 'true' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org (`gh release create` makes the tag).
  release:
    name: 🏷️ GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: write   # tag + GitHub release
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
      # verbatim; change it in all of them or in none.
      - name: GitHub release (notes = this version's CHANGELOG section)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
          awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"

  notify-completion:
    name: 📢 Notify Completion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-version, publish]
    if: always()
    steps:
      - name: 🎉 Success Notification
        if: needs.publish.result == 'success'
        run: |
          echo "🎉 Successfully published WebFlux v${{ needs.detect-version.outputs.version }} to NuGet.org!"
          echo "📦 Package URL: https://www.nuget.org/packages/WebFlux/${{ needs.detect-version.outputs.version }}"

      # A skipped publish (a branch other than main, or a version nuget.org already has) is not a failure.
      - name: ❌ Failure Notification
        if: needs.publish.result == 'failure' || needs.publish.result == 'cancelled'
        run: |
          echo "❌ Failed to publish WebFlux v${{ needs.detect-version.outputs.version }}"
          echo "Check the workflow logs for detailed error information"
          exit 1
